# release-please bot workflow.
#
# On every push to main, release-please inspects commits since the last tag
# (by conventional-commit prefix) and maintains an open "Release v*" PR that
# updates CHANGELOG.md and bumps the version. Merging that PR creates the
# tag and triggers release.yml (goreleaser).
#
# Tag creation is automated; do NOT `git tag` manually.
#
# Docs: https://github.com/googleapis/release-please-action

name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
