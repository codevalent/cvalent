version: 2

builds:
  - id: linux-amd64
    main: ./cmd/cvalent
    binary: cvalent
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-gnu
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -X main.version={{.Version}}

  - id: linux-arm64
    main: ./cmd/cvalent
    binary: cvalent
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-gnu
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -X main.version={{.Version}}

  - id: darwin-amd64
    main: ./cmd/cvalent
    binary: cvalent
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-macos
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -X main.version={{.Version}}

  - id: darwin-arm64
    main: ./cmd/cvalent
    binary: cvalent
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-macos
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: codevalent
    name: cvalent
