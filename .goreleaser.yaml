version: 2

# Rung 0 baseline goreleaser config. Pure-Go (CGO_ENABLED=0) so we don't
# need zig cc, a C toolchain, or per-target build configs. Signing and
# build provenance attestations land in AH-0316.23 — this stub leaves
# room for them in the release.yml workflow without changing the build
# matrix.

builds:
  - id: cvalent
    main: ./cmd/cvalent
    binary: cvalent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: darwin
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: codevalent
    name: cvalent
